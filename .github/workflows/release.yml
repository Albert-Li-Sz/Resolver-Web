name: Release containers
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Check release version
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const p=JSON.parse(readFileSync('package.json')); if(process.env.GITHUB_REF_NAME !== 'v'+p.version || !/^\d+\.\d+\.\d+$/.test(p.version)) throw new Error('tag/package version mismatch');"
      - run: npm ci
      - run: npm run check
      - run: npm test
  build:
    needs: tests
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      ARCH: ${{ matrix.arch }}
      RESOLVER_ADMIN_KEY: release-smoke-key
      RESOLVER_SMOKE_STATE: /tmp/resolver-release-state.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: resolver-web:release-test
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./media-worker
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: resolver-media-worker:release-test
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=media-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=media-${{ matrix.arch }}
      - name: Verify media runtime
        run: docker run --rm --entrypoint ffmpeg resolver-media-worker:release-test -version
      - name: Run container
        run: docker run -d --name resolver-release-test -p 127.0.0.1:4180:4173 -e RESOLVER_ADMIN_KEY -v resolver-release-data:/app/data resolver-web:release-test
      - name: Wait for API
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4180/api/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm run smoke -- http://127.0.0.1:4180
      - run: node scripts/smoke-platform.mjs http://127.0.0.1:4180
      - run: docker restart resolver-release-test
      - name: Wait after restart
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4180/api/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm run smoke -- http://127.0.0.1:4180 verify-restart
      - run: node scripts/smoke-platform.mjs http://127.0.0.1:4180 verify-restart
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested image
        run: |
          docker tag resolver-web:release-test "$IMAGE:sha-${GITHUB_SHA}-${ARCH}"
          docker push "$IMAGE:sha-${GITHUB_SHA}-${ARCH}"
          docker tag resolver-media-worker:release-test "${IMAGE}-media-worker:sha-${GITHUB_SHA}-${ARCH}"
          docker push "${IMAGE}-media-worker:sha-${GITHUB_SHA}-${ARCH}"
      - if: always()
        run: docker logs resolver-release-test || true
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish version manifest
        run: |
          docker buildx imagetools create -t "$IMAGE:$RELEASE_TAG" -t "$IMAGE:${RELEASE_TAG#v}" "$IMAGE:sha-${GITHUB_SHA}-amd64" "$IMAGE:sha-${GITHUB_SHA}-arm64"
          docker buildx imagetools create -t "${IMAGE}-media-worker:$RELEASE_TAG" -t "${IMAGE}-media-worker:${RELEASE_TAG#v}" "${IMAGE}-media-worker:sha-${GITHUB_SHA}-amd64" "${IMAGE}-media-worker:sha-${GITHUB_SHA}-arm64"
      - name: Verify anonymous access and image metadata
        run: node scripts/verify-registry.mjs --image "$IMAGE" --tag "$RELEASE_TAG" --revision "$GITHUB_SHA" --output dist/image-digests.json
      - run: node scripts/verify-registry.mjs --image "${IMAGE}-media-worker" --tag "$RELEASE_TAG" --revision "$GITHUB_SHA" --output dist/media-image-digests.json
      - name: Promote validated image
        run: |
          DIGEST=$(node -p "require('./dist/image-digests.json').digest")
          VERSION=${RELEASE_TAG#v}
          docker buildx imagetools create -t "$IMAGE:latest" -t "$IMAGE:${VERSION%.*}" -t "$IMAGE:${VERSION%%.*}" "$IMAGE@$DIGEST"
          node scripts/verify-registry.mjs --image "$IMAGE" --tag "$RELEASE_TAG" --revision "$GITHUB_SHA" --aliases "latest,${VERSION%.*},${VERSION%%.*},$VERSION"
          MEDIA_DIGEST=$(node -p "require('./dist/media-image-digests.json').digest")
          docker buildx imagetools create -t "${IMAGE}-media-worker:latest" "${IMAGE}-media-worker@$MEDIA_DIGEST"
          node scripts/verify-registry.mjs --image "${IMAGE}-media-worker" --tag "$RELEASE_TAG" --revision "$GITHUB_SHA" --aliases "latest,$VERSION"
      - name: Package deployment files and checksums
        run: node scripts/package-release.mjs
      - name: Publish GitHub Release
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/release/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --draft=false --latest --title "Resolver Web $RELEASE_TAG" --notes-file "releases/$RELEASE_TAG.md" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/release/* --verify-tag --latest --title "Resolver Web $RELEASE_TAG" --notes-file "releases/$RELEASE_TAG.md" --repo "$GITHUB_REPOSITORY"
          fi
