  <header class="app-header"><a class="brand" href="/resolver/" aria-label="ICPC Resolver 首页"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 28 28"><rect x="2" y="15" width="6" height="11" rx="1.5"/><rect x="11" y="2" width="6" height="24" rx="1.5"/><rect x="20" y="10" width="6" height="16" rx="1.5"/></svg></span><span class="brand-name">ICPC Resolver</span></a><nav class="desktop-nav" aria-label="配置页面"><a href="/resolver/">赛事导入</a><a href="/resolver/logos">校徽与照片</a><a href="/resolver/display">画面与奖项</a><a href="/resolver/preview" class="is-active" aria-current="page">滚榜预览</a><a href="/resolver/presets">配置管理</a></nav><div class="header-actions"><a class="btn btn-secondary" href="/">平台首页</a><button type="button" class="status-pill" id="apiStatus" data-state="checking" title="服务连接状态，点击重新检测" aria-label="检查服务连接" aria-live="polite"><span class="status-dot" aria-hidden="true"></span><span class="status-text" id="apiStatusText">连接中…</span></button><button type="button" class="btn btn-primary" id="startBtn"><svg class="icon" aria-hidden="true"><use href="#i-play"></use></svg><span class="btn-label">开始滚榜</span><span class="spinner" aria-hidden="true"></span></button></div></header><nav class="mobile-nav" aria-label="配置页面"><a href="/resolver/">赛事导入</a><a href="/resolver/logos">校徽与照片</a><a href="/resolver/display">画面与奖项</a><a href="/resolver/preview" class="is-active" aria-current="page">滚榜预览</a><a href="/resolver/presets">配置管理</a></nav>

  <main class="page" id="main">
    <section class="page-head">
      <h1>滚榜预览</h1>
      <p class="page-contest" id="pageContest">尚未导入赛事</p>
    </section>
<div class="offline-banner" id="offlineBanner" hidden>
      <svg class="icon" aria-hidden="true"><use href="#i-alert"></use></svg>
      <div class="offline-banner-text">
        <strong>服务暂未连接</strong>
        <span>请检查服务后重试，当前配置已保留。</span>
      </div>
      <button type="button" class="btn btn-sm btn-ghost" id="retryConnBtn">
        <svg class="icon" aria-hidden="true"><use href="#i-refresh"></use></svg>
        <span>重试连接</span>
      </button>
    </div>

    <div class="page-shell page-shell-wide">
<section class="card preview-page-card" id="section-preview" aria-labelledby="previewTitle">
          <div class="card-head card-head-compact">
            <span class="icon-tile" aria-hidden="true"><svg class="icon"><use href="#i-monitor"></use></svg></span>
            <div class="card-head-text">
              <h2 id="previewTitle">预览画布</h2>

            </div>
          </div>

          <div class="preview-status" id="previewStatus" data-state="idle" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="previewStatusText">等待数据</span>
          </div>

          <div class="preview-wrap preview-page-wrap" id="previewWrap">
            <div class="preview-frame preview-page-frame">
              <iframe id="previewFrame" sandbox="allow-scripts allow-same-origin" title="滚榜效果预览" allow="fullscreen; autoplay" loading="lazy"></iframe>
              <div class="preview-overlay" id="previewOverlay">
                <div class="preview-state" id="previewEmpty">
                  <span class="empty-icon" aria-hidden="true"><svg class="icon"><use href="#i-monitor"></use></svg></span>
                  <strong>等待赛事数据</strong>
                  <p>请先导入赛事。</p>
                </div>
                <div class="preview-state" id="previewLoading" hidden>
                  <span class="spinner spinner-lg" aria-hidden="true"></span>
                  <strong>正在生成预览…</strong>
                  <p>正在生成滚榜步骤。</p>
                </div>
                <div class="preview-state" id="previewError" hidden>
                  <span class="empty-icon empty-icon-error" aria-hidden="true"><svg class="icon"><use href="#i-alert"></use></svg></span>
                  <strong id="previewErrorTitle">预览生成失败</strong>
                  <p id="previewErrorDetail">请检查 Node 服务是否已启动。</p>
                  <button type="button" class="btn btn-sm btn-ghost" id="previewRetryBtn">
                    <svg class="icon" aria-hidden="true"><use href="#i-refresh"></use></svg>
                    重试
                  </button>
                </div>
              </div>
            </div>
            <div class="preview-actions">
              <div class="preview-manual-controls">
                <button type="button" class="btn btn-secondary" id="previewPrevBtn">上一步</button>
                <button type="button" class="btn btn-primary" id="previewNextBtn">下一步</button>
                <button type="button" class="btn btn-ghost" id="previewResetBtn">回到开头</button>
              </div>
              <div class="preview-page-meta">
                <span class="preview-hint" id="previewHint">预览生成中…</span>
              <button type="button" class="btn btn-sm btn-ghost" id="refreshPreviewBtn">
                  <svg class="icon" aria-hidden="true"><use href="#i-refresh"></use></svg>
                  <span class="btn-label">刷新预览</span>
                  <span class="spinner" aria-hidden="true"></span>
                </button>
              </div>
            </div>
          </div>
        <p class="field-hint preview-page-note">右键 / → / PageDown：下一步　左键 / ← / PageUp：上一步</p>
</section>
    </div>

<footer class="footer"><span>ICPC Resolver</span><a href="https://github.com/Albert-Li-Sz/Resolver-Web" target="_blank" rel="noopener noreferrer">GitHub</a></footer>
  </main>

  <div class="toast-region" id="toastRegion" role="status" aria-live="polite" aria-atomic="false"></div>


  <script type="module" src="/js/config.js"></script>
  <script type="module" src="/js/live-recovery.js"></script>
</body>
</html>
